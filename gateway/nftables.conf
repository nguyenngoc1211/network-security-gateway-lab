table inet security_filter {
    set blocked_attackers {
        type ipv4_addr
        flags interval
        comment "Incident-response blocklist"
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" counter accept comment "Allow gateway loopback"
        ct state invalid counter drop comment "Drop packets conntrack cannot classify"
        ct state established,related counter accept comment "Allow replies to gateway-originated traffic"

        iifname "eth-lan" ip saddr 10.10.10.0/24 ip protocol icmp \
            icmp type echo-request counter accept comment "Allow LAN to test the gateway"

        iifname "eth-wan" ip saddr 10.10.40.0/24 udp dport 51820 \
            counter accept comment "WireGuard handshake from WAN"

        limit rate 5/second burst 10 packets counter log prefix "NFT INPUT DROP: " drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid counter drop comment "Drop invalid forwarded traffic"
        ip saddr @blocked_attackers counter drop comment "Contain known hostile sources"
        ct state established,related counter accept comment "Allow return traffic for approved connections"

        iifname "eth-lan" oifname "eth-wan" ip saddr 10.10.10.0/24 \
            counter accept comment "LAN to WAN allowed"

        iifname "eth-lan" oifname "eth-uplink" ip saddr 10.10.10.0/24 \
            counter accept comment "LAN to WSL Internet uplink allowed"

        iifname "eth-lan" oifname "eth-dmz" ip saddr 10.10.10.0/24 \
            ip daddr 10.10.20.0/24 tcp dport { 80, 443 } \
            ct state new counter accept comment "LAN to DMZ HTTP and HTTPS allowed"

        iifname "eth-wan" oifname "eth-dmz" ip saddr 10.10.40.0/24 \
            ip daddr 10.10.20.0/24 tcp dport { 80, 443 } \
            ct state new counter accept comment "WAN to DMZ HTTP and HTTPS allowed"

        iifname "wg0" oifname "eth-lan" ip saddr 10.10.30.0/24 \
            ip daddr 10.10.10.10 tcp dport 8080 ct state new \
            counter accept comment "VPN clients to internal demo service"

        iifname "eth-dmz" oifname "eth-lan" ip saddr 10.10.20.0/24 \
            ip daddr 10.10.10.0/24 limit rate 5/second burst 10 packets \
            counter log prefix "NFT DMZ-LAN DROP: " drop

        iifname "eth-wan" oifname "eth-lan" ip saddr 10.10.40.0/24 \
            ip daddr 10.10.10.0/24 limit rate 5/second burst 10 packets \
            counter log prefix "NFT WAN-LAN DROP: " drop

        limit rate 5/second burst 10 packets counter log prefix "NFT FORWARD DROP: " drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
