table ip security_nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        iifname "eth-wan" ip daddr 10.10.40.1 tcp dport 80 \
            counter dnat to 10.10.20.10:80 \
            comment "WAN port 80 forwarded to DMZ proxy"
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        iifname "eth-lan" oifname "eth-wan" ip saddr 10.10.10.0/24 \
            counter masquerade comment "LAN source translated on WAN egress"

        iifname "eth-lan" oifname "eth-uplink" ip saddr 10.10.10.0/24 \
            counter masquerade comment "LAN source translated on Internet uplink"
    }
}
